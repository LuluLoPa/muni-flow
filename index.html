<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MUNI-FLOW | Rescate del Portafolio Municipal</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#1f2937;
}

header{
  background:linear-gradient(135deg,#123b5d,#176b87);
  color:white;
  padding:22px 18px;
}

.header-inner{
  max-width:900px;
  margin:auto;
}

header h1{
  margin:0;
  font-size:27px;
}

header p{
  margin:6px 0 0;
  opacity:.9;
}

.container{
  max-width:900px;
  margin:auto;
  padding:22px 16px 50px;
}

.card{
  background:white;
  border-radius:18px;
  padding:24px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.center{text-align:center}

.badge{
  display:inline-block;
  background:#e5f2f7;
  color:#176b87;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.team{
  border:2px solid #dbe4ec;
  padding:17px;
  border-radius:14px;
  cursor:pointer;
  transition:.2s;
}

.team:hover{
  border-color:#176b87;
  transform:translateY(-2px);
}

.team.selected{
  border-color:#218b70;
  background:#edf9f5;
}

.team strong{
  display:block;
  font-size:18px;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 18px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#218b70;
  color:white;
}

.primary:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.project{
  border:2px solid #e1e7ed;
  border-radius:12px;
  padding:13px;
  margin:9px 0;
  cursor:pointer;
}

.project.selected{
  border-color:#218b70;
  background:#edf9f5;
}

textarea{
  width:100%;
  min-height:120px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  font-family:inherit;
}

.event-title{
  color:#123b5d;
  margin-bottom:8px;
}

.scenario{
  background:#edf5f8;
  border-left:5px solid #176b87;
  padding:15px;
  border-radius:9px;
  line-height:1.55;
  margin:17px 0;
}

.warning{
  background:#fff5d9;
  border-left:5px solid #e8aa25;
  padding:14px;
  border-radius:9px;
  margin:15px 0;
}

.success{
  background:#e8f7f1;
  border-left:5px solid #218b70;
  padding:15px;
  border-radius:9px;
  margin:15px 0;
}

.wait{
  text-align:center;
  padding:25px 10px;
}

.spinner{
  width:36px;
  height:36px;
  border:4px solid #dce5eb;
  border-top-color:#176b87;
  border-radius:50%;
  margin:15px auto;
  animation:spin 1s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.indicators{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:16px;
}

.indicator{
  background:#f8fafc;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
}

.consequence{
  border-left:5px solid #218b70;
  padding:15px;
  background:#f1faf7;
  border-radius:9px;
  line-height:1.55;
}

.connection{
  background:#eef2ff;
  border-left:5px solid #5865c7;
  padding:14px;
  border-radius:9px;
  margin-top:15px;
}

.small{
  font-size:13px;
  color:#64748b;
}

footer{
  text-align:center;
  padding:25px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:600px){
  .team-grid{grid-template-columns:1fr}
  .card{padding:18px}
  header h1{font-size:23px}
}
</style>
</head>

<body>

<header>
<div class="header-inner">
  <h1>🏛️ MUNI-FLOW</h1>
  <p>Rescate del Portafolio Municipal · Simulación Scrumban</p>
</div>
</header>

<div class="container">

<div id="app"></div>

</div>

<footer>
Gerencia de Planes, Programas y Proyectos
</footer>


<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.9.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
 apiKey:"AIzaSyBAP-FucF5-4_5Gem_oFobF5EcNMkArUFs",
 authDomain:"muni-flow.firebaseapp.com",
 databaseURL:"https://muni-flow-default-rtdb.firebaseio.com",
 projectId:"muni-flow",
 storageBucket:"muni-flow.firebasestorage.app",
 messagingSenderId:"652943671856",
 appId:"1:652943671856:web:0467f02991d622da6823f5"
};

firebase.initializeApp(firebaseConfig);
const database=firebase.database();

const teams={
 A:"Horizonte",
 B:"Impulso",
 C:"Conecta",
 D:"Avanza"
};

const projects=[
 "Parque infantil de Los Cipreses",
 "Centro diurno para personas adultas mayores",
 "Reparación del salón comunal",
 "Programa de empleo juvenil",
 "Aceras accesibles frente a la escuela",
 "Recuperación de quebrada municipal",
 "Feria de emprendimientos locales",
 "Iluminación del parque central",
 "Cancha multiuso",
 "Remodelación de oficinas municipales"
];

let selectedTeam=localStorage.getItem("muniflowTeam");
let currentEvent=1;
let revealed=false;
let selectedProjects=[];


/* =========================
   INICIO
========================= */

function startScreen(){

 document.getElementById("app").innerHTML=`

 <div class="card center">

   <span class="badge">MUNICIPALIDAD DE VALLE VERDE</span>

   <h2>Rescate del Portafolio Municipal</h2>

   <p>
   Su equipo asumirá la gestión de una municipalidad
   con múltiples proyectos, presión comunitaria y
   capacidad limitada.
   </p>

   <div class="team-grid">

     ${Object.entries(teams).map(([k,v])=>`
       <div class="team"
            id="team${k}"
            onclick="chooseTeam('${k}')">
         <strong>${k} — ${v}</strong>
         Municipalidad paralela
       </div>
     `).join("")}

   </div>

   <br>

   <button id="enterBtn"
           class="primary"
           disabled
           onclick="enterSimulation()">
     Entrar a la simulación
   </button>

 </div>
 `;
}


function chooseTeam(letter){

 selectedTeam=letter;

 document
 .querySelectorAll(".team")
 .forEach(x=>x.classList.remove("selected"));

 document
 .getElementById("team"+letter)
 .classList.add("selected");

 document.getElementById("enterBtn").disabled=false;
}


function enterSimulation(){

 localStorage.setItem("muniflowTeam",selectedTeam);

 listenControl();
}


/* =========================
   CONTROL EN TIEMPO REAL
========================= */

function listenControl(){

 database.ref("muniflow/control").on("value",snap=>{

   const control=snap.val() || {};

   currentEvent=control.currentEvent || 1;
   revealed=control.consequencesRevealed || false;

   checkTeamState();
 });
}


function checkTeamState(){

 database
 .ref("muniflow/teams/"+selectedTeam+"/evento"+currentEvent)
 .once("value")
 .then(snapshot=>{

   const response=snapshot.val();

   if(response && response.submitted){

      if(revealed){
        showConsequence(response);
      }else{
        waitingScreen();
      }

   }else{

      renderEvent(currentEvent);
   }

 });
}


/* =========================
   EVENTOS
========================= */

function renderEvent(event){

 selectedProjects=[];

 if(event===1) event1();
 if(event===2) event2();
 if(event===3) event3();
 if(event===4) event4();
 if(event>=5) closingScreen();
}


/* EVENTO 1 */

function event1(){

 document.getElementById("app").innerHTML=`

 <div class="card">

 <span class="badge">EVENTO 1 · PRIORIZACIÓN</span>

 <h2 class="event-title">
 Equipo ${selectedTeam} — ${teams[selectedTeam]}
 </h2>

 <div class="scenario">
 La Municipalidad de Valle Verde tiene diez iniciativas
 importantes. La Alcaldía desea impulsarlas todas,
 pero la columna <strong>READY tiene un límite WIP de 5</strong>.
 Su equipo debe decidir cuáles cinco ingresan primero.
 </div>

 <div class="warning">
 🎯 Seleccionen exactamente <strong>5 iniciativas</strong>
 considerando valor público, urgencia, capacidad y prioridades.
 </div>

 <div id="projects">

 ${projects.map((p,i)=>`
   <div class="project"
        id="project${i}"
        onclick="toggleProject(${i})">
      ${p}
   </div>
 `).join("")}

 </div>

 <h3>Justificación</h3>

 <textarea id="answer"
 placeholder="¿Por qué priorizaron estas iniciativas?"></textarea>

 <br><br>

 <button class="primary"
 onclick="submitEvent1()">
 Enviar decisión
 </button>

 </div>
 `;
}


function toggleProject(i){

 const pos=selectedProjects.indexOf(i);

 if(pos>=0){
   selectedProjects.splice(pos,1);
 }else{

   if(selectedProjects.length>=5){
     alert("READY tiene un límite de 5 iniciativas.");
     return;
   }

   selectedProjects.push(i);
 }

 document
 .getElementById("project"+i)
 .classList.toggle("selected");
}


async function submitEvent1(){

 const answer=document.getElementById("answer").value.trim();

 if(selectedProjects.length!==5){
   alert("Deben seleccionar exactamente 5 iniciativas.");
   return;
 }

 if(answer.length<15){
   alert("Escriban una breve justificación.");
   return;
 }

 await saveResponse({
   projects:selectedProjects.map(i=>projects[i]),
   decision:"Priorización de cinco iniciativas",
   justification:answer
 });
}


/* EVENTO 2 */

function event2(){

 genericEvent(
  2,
  "WIP Y PRESIÓN DE ALCALDÍA",
  `
  La columna <strong>FORMULACIÓN TÉCNICA</strong>
  alcanzó su límite WIP de <strong>3 proyectos</strong>.
  En ese momento, la Alcaldía solicita incorporar
  inmediatamente la <strong>Cancha multiuso</strong>
  debido a presión política y comunitaria.
  `,
  `
  ¿Qué hará su equipo para responder a la solicitud
  sin ignorar la capacidad disponible?
  `
 );
}


/* EVENTO 3 */

function event3(){

 genericEvent(
  3,
  "CUELLO DE BOTELLA",
  `
  <strong>VIABILIDAD LEGAL/FINANCIERA</strong>
  alcanzó su límite WIP de <strong>2</strong>.
  Ambos expedientes tienen prevenciones.
  Dos proyectos terminaron Formulación Técnica,
  pero no pueden avanzar.
  La comunidad exige explicaciones.
  `,
  `
  ¿Cómo liberará su equipo el flujo y cómo manejará
  la comunicación con las partes interesadas?
  `
 );
}


/* EVENTO 4 */

function event4(){

 genericEvent(
  4,
  "TAILORING Y GOBERNANZA",
  `
  La Municipalidad recibe recursos para desarrollar
  un <strong>Centro Integral Comunitario</strong>.
  El proyecto tiene presupuesto definido,
  contratación pública, controles, trazabilidad
  y hitos institucionales obligatorios.
  Al mismo tiempo continúan las solicitudes comunitarias.
  `,
  `
  ¿Aplicaría Scrumban de forma pura o realizaría
  Tailoring? Explique cómo combinaría la
  gobernanza macro con la operación cotidiana.
  `
 );
}


function genericEvent(number,title,scenario,question){

 document.getElementById("app").innerHTML=`

 <div class="card">

 <span class="badge">EVENTO ${number}</span>

 <h2 class="event-title">${title}</h2>

 <p><strong>
 Equipo ${selectedTeam} — ${teams[selectedTeam]}
 </strong></p>

 <div class="scenario">${scenario}</div>

 <h3>Decisión del equipo</h3>

 <p>${question}</p>

 <textarea id="decision"
 placeholder="Describan qué harían..."></textarea>

 <h3>Justificación</h3>

 <textarea id="justification"
 placeholder="Expliquen por qué tomarían esa decisión..."></textarea>

 <br><br>

 <button class="primary"
 onclick="submitGeneric(${number})">
 Enviar decisión
 </button>

 </div>
 `;
}


async function submitGeneric(number){

 const decision=
 document.getElementById("decision").value.trim();

 const justification=
 document.getElementById("justification").value.trim();

 if(decision.length<10 || justification.length<10){

   alert(
   "Escriban una decisión y una breve justificación."
   );

   return;
 }

 await saveResponse({
   decision,
   justification
 });
}


/* =========================
   GUARDAR
========================= */

async function saveResponse(extra){

 const data={
   team:selectedTeam,
   name:teams[selectedTeam],
   event:currentEvent,
   submitted:true,
   timestamp:Date.now(),
   ...extra
 };

 try{

   await database
   .ref(
    "muniflow/teams/"+
    selectedTeam+
    "/evento"+
    currentEvent
   )
   .set(data);

   waitingScreen();

 }catch(error){

   alert(
   "No fue posible enviar la decisión. Inténtelo nuevamente."
   );

 }
}


/* =========================
   ESPERA
========================= */

function waitingScreen(){

 document.getElementById("app").innerHTML=`

 <div class="card wait">

   <span class="badge">
   EQUIPO ${selectedTeam} · ${teams[selectedTeam]}
   </span>

   <div class="spinner"></div>

   <h2>Decisión registrada</h2>

   <div class="success">
   🔥 Su respuesta llegó correctamente al
   Centro de Control de MUNI-FLOW.
   </div>

   <p>
   Esperen a que la persona facilitadora
   revele las consecuencias.
   </p>

   <p class="small">
   Esta pantalla cambiará automáticamente.
   No necesitan actualizarla.
   </p>

 </div>
 `;
}


/* =========================
   CONSECUENCIAS
========================= */

function analyze(text,event){

 text=(text||"").toLowerCase();

 let value="🟢 Saludable";
 let flow="🟡 En tensión";
 let governance="🟢 Saludable";
 let adaptability="🟡 En tensión";

 let consequence="";
 let connection="";


 /* ==========================
    EVENTO 1
 ========================== */

 if(event===1){

   consequence=
   "El equipo estableció una prioridad inicial y limitó el trabajo que entra a READY. Esto permite concentrar la capacidad municipal, aunque las iniciativas que permanecen en Backlog deberán revisarse posteriormente mediante Replenishment.";

   connection=
   "En Scrumban, priorizar no significa declarar que los demás proyectos carecen de importancia. Significa decidir qué trabajo puede entrar al sistema de acuerdo con el valor público y la capacidad disponible.";

   flow="🟢 Saludable";
   adaptability="🟡 En tensión";
 }


 /* ==========================
    EVENTO 2
 ========================== */

 if(event===2){

   const overload=
     text.includes("incorporaremos inmediatamente") ||
     text.includes("incorporar inmediatamente") ||
     text.includes("ingresaremos inmediatamente") ||
     text.includes("agregaremos inmediatamente") ||
     text.includes("aunque") && text.includes("wip") ||
     text.includes("aunque") && text.includes("límite") ||
     text.includes("aunque") && text.includes("limite") ||
     text.includes("superar") && text.includes("wip") ||
     text.includes("sobrepas") ||
     text.includes("exced") && text.includes("wip") ||
     text.includes("por presión") ||
     text.includes("por presion");

   const protectCapacity=
     text.includes("terminaremos") ||
     text.includes("terminar primero") ||
     text.includes("liberar capacidad") ||
     text.includes("liberaremos") ||
     text.includes("respetar") && text.includes("wip") ||
     text.includes("mantener") && text.includes("wip") ||
     text.includes("mantendremos") && text.includes("límite") ||
     text.includes("mantendremos") && text.includes("limite") ||
     text.includes("negociar") ||
     text.includes("negociaremos") ||
     text.includes("swarming") ||
     text.includes("swarm") ||
     text.includes("no incorporar") ||
     text.includes("esperar") && text.includes("capacidad");

   if(overload){

     consequence=
     "El equipo obtiene una respuesta inmediata frente a la presión de Alcaldía y de la comunidad. Sin embargo, incorporar trabajo cuando Formulación Técnica ya alcanzó su límite WIP aumenta el trabajo en proceso, la multitarea y el riesgo de retrasar los proyectos que ya estaban en ejecución.";

     flow="🔴 Crítico";
     adaptability="🟡 En tensión";

   }else if(protectCapacity){

     consequence=
     "El equipo protege la capacidad del sistema y busca liberar espacio antes de incorporar nuevo trabajo. Esto favorece la continuidad del flujo, aunque puede exigir negociar con Alcaldía y gestionar expectativas políticas y comunitarias.";

     flow="🟢 Saludable";
     adaptability="🟢 Saludable";

   }else{

     consequence=
     "La decisión intenta responder a la nueva demanda, pero no queda suficientemente claro cómo se protegerá el límite WIP. El equipo necesitaría precisar qué trabajo terminará, pausará o reorganizará antes de incorporar la nueva iniciativa.";

     flow="🟡 En tensión";
     adaptability="🟡 En tensión";
   }

   connection=
   "El límite WIP representa capacidad real, no una recomendación decorativa. Pull y el principio Stop Starting, Start Finishing ayudan a evitar que nuevas presiones congestionen el sistema.";
 }


 /* ==========================
    EVENTO 3
 ========================== */

 if(event===3){

   const overloadBottleneck=
     text.includes("pasaremos los proyectos") ||
     text.includes("moveremos los proyectos") ||
     text.includes("avanzaremos los proyectos") ||
     text.includes("ingresaremos los proyectos") ||
     text.includes("aunque esté lleno") ||
     text.includes("aunque este lleno") ||
     text.includes("superaremos el límite") ||
     text.includes("superaremos el limite") ||
     text.includes("aumentaremos el wip");

   const attackBottleneck=
     text.includes("swarming") ||
     text.includes("swarm") ||
     text.includes("resolver") && text.includes("prevencion") ||
     text.includes("resolver") && text.includes("prevención") ||
     text.includes("atender") && text.includes("prevencion") ||
     text.includes("atender") && text.includes("prevención") ||
     text.includes("liberar") && text.includes("cuello") ||
     text.includes("apoy") && text.includes("viabilidad") ||
     text.includes("redistribuir") ||
     text.includes("reorganizar") ||
     text.includes("comunicar") ||
     text.includes("informar a la comunidad") ||
     text.includes("transparencia");

   if(overloadBottleneck){

     consequence=
     "El equipo logra mostrar movimiento de proyectos a corto plazo, pero trasladar más trabajo hacia una etapa que ya está saturada no elimina el cuello de botella. El inventario aumenta y los tiempos de espera pueden crecer.";

     flow="🔴 Crítico";
     adaptability="🟡 En tensión";

   }else if(attackBottleneck){

     consequence=
     "El equipo dirige atención hacia el cuello de botella y busca resolver las prevenciones antes de seguir acumulando trabajo. La comunicación con la comunidad también mejora la transparencia, aunque la estrategia requiere coordinación entre distintas especialidades.";

     flow="🟢 Saludable";
     adaptability="🟢 Saludable";

   }else{

     consequence=
     "El equipo reconoce la situación, pero la decisión no muestra con suficiente claridad cómo se liberará capacidad en Viabilidad Legal/Financiera. El riesgo es que los proyectos continúen acumulándose antes del cuello de botella.";

     flow="🟡 En tensión";
     adaptability="🟡 En tensión";
   }

   connection=
   "Cuando aparece un cuello de botella, Scrumban favorece inspeccionar el sistema y concentrar capacidad donde está el bloqueo. Swarming y adaptación pueden ser más útiles que continuar iniciando trabajo.";
 }


 /* ==========================
    EVENTO 4
 ========================== */

 if(event===4){

   const ignoreGovernance=
     text.includes("scrumban puro") ||
     text.includes("scrum ban puro") ||
     text.includes("sin tailoring") ||
     text.includes("sin adaptar") ||
     text.includes("sin controles") ||
     text.includes("evitar los controles") ||
     text.includes("omitir") && text.includes("contrat") ||
     text.includes("ignorar") && text.includes("presupuesto") ||
     text.includes("sin considerar") && text.includes("legal");

   const tailoring=
     (
       text.includes("tailoring") ||
       text.includes("adaptaremos") ||
       text.includes("adaptar") ||
       text.includes("ajustaremos")
     )
     &&
     (
       text.includes("presupuesto") ||
       text.includes("contrat") ||
       text.includes("trazabilidad") ||
       text.includes("control") ||
       text.includes("legal") ||
       text.includes("hitos") ||
       text.includes("gobernanza")
     );

   const macroMicro=
     (
       text.includes("macro") &&
       text.includes("micro")
     ) ||
     (
       text.includes("gobernanza") &&
       (
         text.includes("operación") ||
         text.includes("operacion")
       )
     );

   if(ignoreGovernance){

     consequence=
     "El equipo privilegia la agilidad operativa, pero aplicar Scrumban sin adaptar el método al marco institucional genera tensión con las obligaciones presupuestarias, legales, de contratación y trazabilidad del proyecto público.";

     governance="🔴 Crítico";
     adaptability="🟡 En tensión";
     flow="🟡 En tensión";

   }else if(tailoring && macroMicro){

     consequence=
     "El equipo articula la gobernanza institucional con la gestión ágil del trabajo. Presupuesto, contratación, controles, trazabilidad e hitos permanecen en el nivel macro, mientras Scrumban organiza visualmente la operación, el flujo y la capacidad en el nivel micro.";

     governance="🟢 Saludable";
     adaptability="🟢 Saludable";
     flow="🟢 Saludable";

   }else if(tailoring){

     consequence=
     "El equipo reconoce la necesidad de adaptar Scrumban al contexto público e incorpora controles institucionales. La propuesta es consistente, aunque podría precisar mejor qué elementos corresponden a la gobernanza macro y cuáles a la operación cotidiana.";

     governance="🟢 Saludable";
     adaptability="🟢 Saludable";
     flow="🟡 En tensión";

   }else{

     consequence=
     "La propuesta contiene elementos útiles, pero no queda suficientemente definida la relación entre la gestión ágil del flujo y las obligaciones legales, presupuestarias y de contratación pública.";

     governance="🟡 En tensión";
     adaptability="🟡 En tensión";
     flow="🟡 En tensión";
   }

   connection=
   "Tailoring no significa eliminar controles. Significa adaptar la forma de trabajo al contexto: gobernanza macro para obligaciones institucionales y Scrumban en la microoperación para visualizar, limitar y mejorar el flujo.";
 }


 return{
   value,
   flow,
   governance,
   adaptability,
   consequence,
   connection
 };

}


function showConsequence(response){

 const combined=
 (response.decision||"")+" "+
 (response.justification||"");

 const result=analyze(combined,currentEvent);

 document.getElementById("app").innerHTML=`

 <div class="card">

 <span class="badge">
 CONSECUENCIA · EVENTO ${currentEvent}
 </span>

 <h2>
 Equipo ${selectedTeam} — ${teams[selectedTeam]}
 </h2>

 <div class="consequence">
